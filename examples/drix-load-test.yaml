# Scénario de charge pour Drix-API
name: "Drix Full Traffic"

# Liste des routes que le load tester va appeler
routes:
  # Route 1 : Lecture du feed (Poids élevé pour simuler beaucoup de lecteurs)
  - method: GET
    path: /api/posts/feed
    weight: 10

  # Route 2 : Page des cours
  - method: GET
    path: /api/courses
    weight: 3

  # Route 3 : Test de connexion (Poids faible car moins fréquent)
  - method: POST
    path: /api/auth/login
    weight: 1
    body: '{"email": "test@example.com", "password": "password123"}'

  # Route 4 : Test de notifications
  - method: GET
    path: /api/posts/notifications/summary
    weight: 2
